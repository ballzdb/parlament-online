{% extends 'base.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
  <div class="card">
    <h1>Реєстрація</h1>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="errorlist">{{ field.errors }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn">Зареєструватися</button>
      <button type="button" class="btn secondary" onclick="togglePasswordVisibility()">Показати пароль</button>
    </form>
  </div>
  <script>
    function togglePasswordVisibility() {
      const field = document.querySelector('input[name="password"]');
      if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
      }
    }
  </script>
{% endblock %}
