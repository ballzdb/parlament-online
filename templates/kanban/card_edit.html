{% extends 'base.html' %}
{% block title %}Редагування завдання{% endblock %}
{% block content %}
  <div class="card form-card">
    <p class="eyebrow">ДОШКА ЗАВДАНЬ</p><h1>Оновити завдання</h1>
    <p class="meta">{{ card.title }}</p>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {% for field in form %}
        <div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="errorlist">{{ field.errors }}</div>{% endif %}</div>
      {% endfor %}
      <div class="detail-actions"><button type="submit" class="btn">Зберегти зміни</button><a href="{% url 'kanban:card_detail' card.pk %}">Скасувати</a></div>
    </form>
  </div>
{% endblock %}
