{% extends 'base.html' %}

{% block title %}Підтримка{% endblock %}

{% block content %}
  <h1>Підтримка</h1>
  <div class="record-list">
  {% for faq in faqs %}
    <article class="card record-card">
      <h3>{{ faq.question }}</h3>
      <p>{{ faq.answer }}</p>
    </article>
  {% empty %}
    <div class="empty-state">Питань поки не додано.</div>
  {% endfor %}
  </div>
{% endblock %}
