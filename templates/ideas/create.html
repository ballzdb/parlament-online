{% extends 'base.html' %}

{% block title %}Нова ідея{% endblock %}

{% block content %}
  <div class="card form-card">
    <h1>Подати ідею</h1>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="errorlist">{{ field.errors }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn">Подати ідею</button>
    </form>
  </div>
{% endblock %}
